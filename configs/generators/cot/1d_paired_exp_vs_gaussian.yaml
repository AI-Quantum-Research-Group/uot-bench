# Split out of 1d_paired.yaml: only the exp-vs-gaussian sizes, so the
# SGD exponential rerun can be sharded per distribution.
# cauchy-vs-gaussian is deliberately excluded -- it already has
# good data at all four regs from the October 2025 run.
generators:
  1D-exp-vs-gaussian-32p:
    generator: uot.problems.generators.PairedGenerator
    num_datasets: 31
    gen_a_cfg:
      class: uot.problems.generators.IndependentExponentialGenerator
      params:
        dim: 1
        borders: &id001
        - -1
        - 1
        cost_fn: uot.utils.costs.cost_euclid_squared
        measure_mode: discrete
        n_points: 32
        seed: 55
    gen_b_cfg:
      class: uot.problems.generators.GaussianMixtureGenerator
      params:
        dim: 1
        borders: *id001
        cost_fn: uot.utils.costs.cost_euclid_squared
        measure_mode: discrete
        n_points: 32
        seed: 55
        num_components: 1
        use_jax: false
  1D-exp-vs-gaussian-64p:
